<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Учёт КФХ — A · Спокойный фермерский</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600;7..72,700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e8f0e4;
      --bg-deep: #d5e4cf;
      --surface: #f7faf5;
      --fg: #1c2a1a;
      --muted: #5f6f5a;
      --border: #c5d4bf;
      --accent: #2f6b3a;
      --accent-hover: #255730;
      --font-display: "Literata", Georgia, serif;
      --font-body: "Source Sans 3", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--fg); font-family: var(--font-body);
      background:
        radial-gradient(900px 480px at 85% 10%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 55%),
        linear-gradient(165deg, var(--bg) 0%, var(--bg-deep) 100%);
      display: grid; place-items: center; padding: 24px;
    }
    .shell { width: min(440px, 100%); animation: rise .5s ease both; }
    .brand { font-family: var(--font-display); font-size: clamp(2rem, 6vw, 2.75rem); font-weight: 700; letter-spacing: -.02em; line-height: 1.1; margin: 0 0 6px; }
    .owner { color: var(--muted); margin: 0 0 28px; font-size: 1.05rem; }
    .panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 28px 24px 24px; box-shadow: 0 18px 40px color-mix(in srgb, var(--fg) 8%, transparent);
    }
    .label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 10px; font-weight: 500; }
    .roles { display: grid; gap: 8px; margin-bottom: 20px; }
    .role {
      appearance: none; width: 100%; text-align: left; cursor: pointer;
      border: 1px solid var(--border); background: #fff; color: var(--fg);
      border-radius: 10px; padding: 12px 14px; font: 500 1rem var(--font-body);
      transition: border-color .15s, background .15s, transform .1s;
    }
    .role:hover { border-color: var(--accent); }
    .role[aria-pressed="true"] {
      border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, #fff);
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .role small { display: block; color: var(--muted); font-weight: 400; font-size: .82rem; margin-top: 2px; }
    .btn {
      width: 100%; border: 0; border-radius: 10px; padding: 13px 16px; cursor: pointer;
      background: var(--accent); color: #f4faf4; font: 600 1rem var(--font-body);
      transition: background .15s, transform .1s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: translateY(1px); }
    .tag { margin-top: 18px; color: var(--muted); font-size: .8rem; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <main class="shell">
    <h1 class="brand">Учёт КФХ</h1>
    <p class="owner">Галимов Р.М.</p>
    <section class="panel" aria-label="Вход">
      <span class="label">Кто входит</span>
      <div class="roles" role="group" aria-label="Роль">
        <button class="role" type="button" aria-pressed="true" data-role="owner">Владелец<small>Сводка, решения, контроль</small></button>
        <button class="role" type="button" aria-pressed="false" data-role="store">Кладовщик<small>Остатки, приход, списание</small></button>
        <button class="role" type="button" aria-pressed="false" data-role="sales">Продажи<small>Отгрузки и касса</small></button>
        <button class="role" type="button" aria-pressed="false" data-role="dev">Разработчик<small>Сервисный доступ</small></button>
      </div>
      <button class="btn" type="button">Войти</button>
    </section>
    <p class="tag">Вариант A · спокойный фермерский</p>
  </main>
  <script>
    const roles = [...document.querySelectorAll(".role")];
    roles.forEach((btn) => btn.addEventListener("click", () => {
      roles.forEach((b) => b.setAttribute("aria-pressed", "false"));
      btn.setAttribute("aria-pressed", "true");
    }));
  </script>
</body>
</html>
