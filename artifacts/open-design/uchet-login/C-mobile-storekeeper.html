<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Учёт КФХ — C · Mobile-first кладовщик</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f2ebe1;
      --surface: #fffdf8;
      --fg: #1b1712;
      --muted: #7a7166;
      --border: #ddd2c3;
      --accent: #0e7c66;
      --accent-soft: #d8f0e9;
      --warn: #b45309;
      --font: "Manrope", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: var(--font); color: var(--fg);
      background:
        linear-gradient(180deg, #efe6d8 0%, var(--bg) 45%, #e7ddd0 100%);
      display: flex; justify-content: center;
    }
    .phone {
      width: min(430px, 100%); min-height: 100vh; padding: 28px 20px 32px;
      display: flex; flex-direction: column; animation: rise .45s ease both;
    }
    .top { margin-bottom: 28px; }
    .eyebrow { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
    .brand { margin: 0; font-size: clamp(2.2rem, 9vw, 2.8rem); font-weight: 800; letter-spacing: -.04em; line-height: 1.05; }
    .owner { margin: 8px 0 0; color: var(--muted); font-weight: 500; }
    .sheet {
      margin-top: auto; background: var(--surface); border: 1px solid var(--border);
      border-radius: 22px 22px 18px 18px; padding: 18px 16px 16px;
      box-shadow: 0 -8px 30px color-mix(in srgb, var(--fg) 6%, transparent);
    }
    .sheet h2 { margin: 0 0 4px; font-size: 1.15rem; font-weight: 700; }
    .sheet p { margin: 0 0 14px; color: var(--muted); font-size: .9rem; }
    .roles { display: grid; gap: 8px; margin-bottom: 14px; }
    .role {
      appearance: none; width: 100%; min-height: 56px; cursor: pointer; text-align: left;
      border: 1px solid var(--border); background: #fff; border-radius: 14px;
      padding: 12px 14px; font: 700 1.02rem var(--font); color: var(--fg);
      display: flex; align-items: center; justify-content: space-between;
      transition: background .15s, border-color .15s, transform .1s;
    }
    .role:active { transform: scale(.985); }
    .role em { font-style: normal; color: var(--muted); font-weight: 500; font-size: .8rem; }
    .role[aria-pressed="true"] {
      border-color: var(--accent); background: var(--accent-soft);
    }
    .role[aria-pressed="true"]::after {
      content: "✓"; color: var(--accent); font-weight: 800;
    }
    .btn {
      width: 100%; min-height: 54px; border: 0; border-radius: 14px; cursor: pointer;
      background: var(--accent); color: #f3fffb; font: 800 1.05rem var(--font);
    }
    .note {
      margin-top: 12px; text-align: center; color: var(--muted); font-size: .78rem; font-weight: 600;
    }
    .tag { margin-top: 10px; text-align: center; color: var(--muted); font-size: .75rem; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (min-width: 860px) {
      body { align-items: center; padding: 24px; }
      .phone {
        min-height: 760px; border: 1px solid var(--border); border-radius: 28px;
        background: color-mix(in srgb, var(--surface) 55%, transparent);
        box-shadow: 0 24px 60px color-mix(in srgb, var(--fg) 12%, transparent);
      }
    }
  </style>
</head>
<body>
  <main class="phone">
    <header class="top">
      <p class="eyebrow">КФХ · полевой доступ</p>
      <h1 class="brand">Учёт КФХ</h1>
      <p class="owner">Галимов Р.М.</p>
    </header>

    <section class="sheet" aria-label="Вход">
      <h2>Кто вы сегодня?</h2>
      <p>Крупные зоны нажатия — удобно в перчатках и на ходу.</p>
      <div class="roles" role="group" aria-label="Роль">
        <button class="role" type="button" aria-pressed="false">Владелец<em>сводка</em></button>
        <button class="role" type="button" aria-pressed="true">Кладовщик<em>остатки</em></button>
        <button class="role" type="button" aria-pressed="false">Продажи<em>отгрузки</em></button>
        <button class="role" type="button" aria-pressed="false">Разработчик<em>сервис</em></button>
      </div>
      <button class="btn" type="button">Войти</button>
      <p class="note">По умолчанию — сценарий кладовщика</p>
    </section>
    <p class="tag">Вариант C · mobile-first</p>
  </main>
  <script>
    const roles = [...document.querySelectorAll(".role")];
    roles.forEach((btn) => btn.addEventListener("click", () => {
      roles.forEach((b) => b.setAttribute("aria-pressed", "false"));
      btn.setAttribute("aria-pressed", "true");
    }));
  </script>
</body>
</html>
